<svg width="640" height="180" viewBox="0 0 640 180" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <g stroke="#8CB4E0" stroke-width="2" opacity="0.85">
    <!-- chords -->
    <line x1="10" y1="30" x2="630" y2="30"/>
    <line x1="10" y1="150" x2="630" y2="150"/>
    <!-- left/right end posts -->
    <line x1="10" y1="30" x2="10" y2="150"/>
    <line x1="630" y1="30" x2="630" y2="150"/>
    <!-- king post center -->
    <line x1="320" y1="30" x2="320" y2="150"/>
    <!-- diagonals -->
    <line x1="10" y1="150" x2="165" y2="30"/>
    <line x1="165" y1="150" x2="320" y2="30"/>
    <line x1="320" y1="150" x2="475" y2="30"/>
    <line x1="475" y1="150" x2="630" y2="30"/>
    <!-- verticals -->
    <line x1="165" y1="30" x2="165" y2="150"/>
    <line x1="475" y1="30" x2="475" y2="150"/>
  </g>
  <g fill="#E8890C">
    <circle cx="10" cy="30" r="4"/>
    <circle cx="320" cy="30" r="4"/>
    <circle cx="630" cy="30" r="4"/>
    <circle cx="165" cy="30" r="3.5"/>
    <circle cx="475" cy="30" r="3.5"/>
    <circle cx="10" cy="150" r="4"/>
    <circle cx="165" cy="150" r="3.5"/>
    <circle cx="320" cy="150" r="4"/>
    <circle cx="475" cy="150" r="3.5"/>
    <circle cx="630" cy="150" r="4"/>
  </g>
</svg>
